name: tianji-ai-academy
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tianji_ai_academy
      MYSQL_USER: tianji
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: mysql
      DB_NAME: tianji_ai_academy
      DB_USERNAME: tianji
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set administrator password}
      DEMO_DATA: false
      AI_ENABLED: ${AI_ENABLED:false}
      AI_API_KEY: ${AI_API_KEY:disabled}
      AI_BASE_URL: ${AI_BASE_URL:https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:deepseek-chat}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:disabled}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:https://api.openai.com}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:text-embedding-3-small}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build: ./tj-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - server
volumes:
  mysql-data:
  redis-data:
